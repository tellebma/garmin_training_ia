services:
  garmin-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: garmin-sync:dev
    container_name: garmin-sync
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
