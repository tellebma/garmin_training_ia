services:
  garmin-sync:
    image: tellebma/garmin-sync:latest
    container_name: garmin-sync
    restart: unless-stopped
    pull_policy: always
    ports:
      - '127.0.0.1:8080:8080'
    env_file:
      - .env
    networks:
      - npm-net
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  npm-net:
    external: true
