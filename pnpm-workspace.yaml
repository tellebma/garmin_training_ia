allowBuilds:
  sharp: true
  unrs-resolver: true
# Force sharp >=0.35.0 to clear GHSA-f88m-g3jw-g9cj (libvips CVEs) inherited via next.
# next pins sharp@^0.34.3 as an optional dep; this override bumps it past the advisory.
overrides:
  sharp: ^0.35.0
  # next pins postcss@8.4.31 exactly; GHSA-6g55-p6wh-862q needs >=8.5.12,
  # GHSA-r28c-9q8g-f849 needs >=8.5.18.
  postcss: ^8.5.18
  # @ducanh2912/next-pwa > workbox-build > @rollup/plugin-terser pins
  # serialize-javascript@6.0.2; GHSA-5c6j-r48x-rmvq (RCE) and
  # GHSA-qj8w-gfj5-8c6v (DoS) are only fixed from 7.0.5 (no 6.x patch release).
  serialize-javascript: ^7.0.5
  # workbox-build/eslint/typescript-eslint pull three separate brace-expansion
  # majors transitively; GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg and
  # GHSA-rgw5-rvv9-x895 need >=1.1.18 / >=2.1.4 / >=5.0.9 respectively.
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  # ajv (via workbox-build/glob) pins fast-uri@3.1.2; GHSA-v2hh-gcrm-f6hx,
  # GHSA-7p8r-x3mc-p8w7 and GHSA-4c8g-83qw-93j6 need >=3.1.5.
  fast-uri: ^3.1.5
  # semantic-release/@octokit chain pins js-yaml@4.1.1; GHSA-h67p-54hq-rp68,
  # GHSA-52cp-r559-cp3m and GHSA-5p4m-2wfm-xmqj need >=4.3.1.
  js-yaml: ^4.3.1
  # next > postcss pins nanoid@3.3.16 (already tracked above for postcss);
  # GHSA-2v37-7h3g-55p8 needs >=3.3.18.
  nanoid: ^3.3.18
  # semantic-release pins undici@7.25.0 (and a 6.27.0 branch elsewhere);
  # GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q, GHSA-hm92-r4w5-c3mj and others
  # need >=7.29.0 / >=6.28.0.
  undici@7: ^7.29.0
  undici@6: ^6.28.0
# vite is only ever pulled in as a peerDependency (vitest, @vitejs/plugin-react);
# pnpm's `overrides` do not affect auto-installed peer resolution, so a
# workspace override here is silently ignored. Pinned as a direct devDependency
# instead (package.json) at ^8.0.16 to clear GHSA-v6wh-96g9-6wx3 and
# GHSA-fx2h-pf6j-xcff (vite was resolving to the vulnerable 8.0.13).
