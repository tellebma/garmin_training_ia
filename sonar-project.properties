# SonarQube project configuration
# Scanned by .github/workflows/ci.yml via SonarSource/sonarqube-scan-action@v4

sonar.projectKey=garmin_training_ia
sonar.projectName=Garmin Training Coach
sonar.projectVersion=0.1.0

# Sources and tests
sonar.sources=app,lib,components,worker/src
sonar.tests=tests,worker/tests
sonar.test.inclusions=tests/**/*.test.{ts,tsx},worker/tests/**/*.py

# CPD exclusions — test files naturally share setup/mock boilerplate,
# and the onboarding/profile *-form.tsx files share view/edit patterns
# that would naturally dedupe via a shared <FormField> component (planned
# in a follow-up refactor; tracked in plan Task 8).
sonar.cpd.exclusions=tests/**,worker/tests/**,app/(app)/onboarding/_components/**,app/(app)/profile/_components/**
sonar.python.coverage.reportPaths=worker/coverage/coverage.xml
sonar.python.version=3.12

# Language/parser
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions — vendor, generated, scaffolds, UI library
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.config.{ts,mjs,js},\
  **/next-env.d.ts,\
  components/ui/**,\
  app/**/layout.tsx,\
  app/**/loading.tsx,\
  app/**/error.tsx,\
  app/**/not-found.tsx,\
  public/**,\
  supabase/migrations/**

# Coverage exclusions — fichiers sans logique testable (RSC routes, FastAPI entry)
sonar.coverage.exclusions=\
  app/**/layout.tsx,\
  app/**/loading.tsx,\
  app/**/error.tsx,\
  app/**/not-found.tsx,\
  app/**/page.tsx,\
  components/ui/**,\
  supabase/migrations/**,\
  worker/src/garmin_sync/main.py

# Coverage report (LCOV from Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# New code period — uses the default branch as reference for "new code" gate
sonar.newCode.referenceBranch=main
