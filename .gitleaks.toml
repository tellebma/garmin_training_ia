[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules''',
  '''pnpm-lock\.yaml''',
  '''\.env\.local\.example''',
  '''public/.+\.(png|jpg|svg|webp|ico)''',
  '''docs/superpowers/.*\.md''',
  '''worker/tests/.*\.py''',
  '''worker/\.env\.example''',
]
regexes = [
  '''example\.(com|supabase\.co)''',
  '''your-(anon-key|project)''',
  '''Mk7-aBcDEfGhIjKlMnOpQrStUvWxYz0123456789abc=''',
  '''(?i)(fake|test|sample|dummy|placeholder)[-_]?(key|token|secret)''',
  # `curl -u "${SONAR_TOKEN}:"` in CI uses an Actions secret reference,
  # not a literal credential — gitleaks' curl-auth-user rule cannot
  # distinguish `${VAR}` interpolation from a hardcoded token.
  '''curl[^"]*"\$\{SONAR_TOKEN\}:"''',
]
stopwords = [
  '''SONAR_TOKEN''',
]
