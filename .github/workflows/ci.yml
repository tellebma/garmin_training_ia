name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-test
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1

  test-worker:
    name: Worker tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: { version: '0.5.x' }
      - name: Install Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync --all-groups --frozen
      - name: Pytest with coverage
        run: uv run pytest --cov=garmin_sync --cov-report=xml:coverage/coverage.xml --cov-report=lcov:coverage/lcov.info
      - name: Upload worker coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: |
            worker/coverage/coverage.xml
            worker/coverage/lcov.info
          retention-days: 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-test

  audit:
    name: Dependencies audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-emoji:
    name: No emoji in UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for emoji in app/ and components/
        run: |
          # Grep for unicode emoji ranges (BMP emoji, supplemental, transport, misc symbols)
          if grep -rP "[\x{1F300}-\x{1F9FF}\x{2600}-\x{27BF}]" app/ components/ 2>/dev/null; then
            echo "Emoji detected in UI source — replace with Lucide React icons"
            exit 1
          fi
          echo "OK : no emoji in UI source"

  sonarqube:
    name: SonarQube scan + gate
    runs-on: ubuntu-latest
    needs: [test-unit, test-worker]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/
      - name: Download worker coverage
        uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: worker/coverage/
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: SonarQube quality gate check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Enforce 90% global coverage (owner objective)
        if: vars.ENFORCE_90_COVERAGE == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          sleep 5
          COVERAGE=$(curl -sS -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/measures/component?component=garmin_training_ia&metricKeys=coverage" \
            | jq -r '.component.measures[0].value // "0"') # gitleaks:allow
          echo "Global coverage: ${COVERAGE}%"
          awk -v c="$COVERAGE" 'BEGIN { exit (c+0 < 90) ? 1 : 0 }'

  tag-main:
    name: Tag validated main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test-unit, test-worker, build, audit, secrets, no-emoji, sonarqube]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push build tag
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' package.json)
          SHORT_SHA=${SHA:0:7}
          TAG="main-v${VERSION}-build.${RUN_NUMBER}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Validated main build ${SHORT_SHA}"
          git push origin "$TAG"
          echo "Created tag: $TAG"
