name: Worker CI

on:
  pull_request:
    branches: [main, master]
    paths: ['worker/**']
  push:
    branches: [main, master]
    paths: ['worker/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: { version: '0.5.x' }
      - name: Install Python
        run: uv python install 3.12
      - name: Install deps
        run: uv sync --all-groups --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/
      - name: Pytest with coverage
        run: uv run pytest -v --cov=garmin_sync --cov-report=lcov:coverage/lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage-lcov
          path: worker/coverage/lcov.info
          retention-days: 1

  audit:
    name: Dependencies audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with: { version: '0.5.x' }
      - name: Install Python
        run: uv python install 3.12
      # Le frontend a `pnpm audit` en CI, le worker n'avait rien : huit avis sur
      # pyjwt — la brique qui vérifie les JWT — ont pu s'accumuler sans bruit.
      # `uv export` produit l'arbre verrouillé exact, pip-audit le confronte aux
      # bases PyPI/OSV.
      - name: Export locked dependency tree
        run: uv export --no-hashes --no-emit-project --all-groups > requirements-audit.txt
      # --no-deps : l'arbre exporté est déjà complet et épinglé, donc rien à
      # résoudre. Sans ce drapeau pip-audit crée un venv et `ensurepip` échoue
      # (exit 127) sur le Python autonome installé par uv.
      - name: pip-audit
        run: uvx pip-audit --no-deps -r requirements-audit.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          push: false
          tags: garmin-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
